<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Trust Game - Participant Entry</title>
	<link rel="stylesheet" type="text/css" href="css/slides.css">
	<style>
		body {
			font-family: sans-serif;
			padding: 20px;
			max-width: 800px;
			margin: 0 auto;
			text-align: center;
		}
		.button {
			background: #2C59B1;
			color: #fff;
			border: none;
			padding: 10px 20px;
			font-size: 16px;
			border-radius: 5px;
			cursor: pointer;
			margin: 10px 0;
		}
		.button:hover {
			background: #1A4292;
		}
		input[type="text"] {
			font-size: 18px;
			padding: 10px;
			margin: 20px 0;
			width: 300px;
			text-align: center;
		}
		.admin-link {
			position: absolute;
			bottom: 10px;
			right: 10px;
			color: #999;
			font-size: 12px;
			text-decoration: none;
		}
		.admin-link:hover {
			color: #666;
		}
	</style>
</head>
<body>
	<h1>Trust Game</h1>
	
	<div id="participant-form">
		<h2>Enter Participant ID</h2>
		<p>Please enter the participant ID before starting the experiment.</p>
		
		<form id="id-form">
			<input type="text" id="participant-id" placeholder="Participant ID" required>
			<br>
			<button type="submit" class="button">Start Experiment</button>
		</form>
	</div>
	
	<a href="export.html" class="admin-link">Data Export</a>
	
	<script src="js/lib/dataRecorder.js"></script>
	<script>
		// Handle form submission
		document.getElementById('id-form').addEventListener('submit', function(e) {
			e.preventDefault();
			
			var id = document.getElementById('participant-id').value.trim();
			if (!id) {
				alert('Please enter a participant ID.');
				return;
			}
			
			// Save ID to localStorage
			localStorage.setItem('current_participant_id', id);
			
			// Redirect to main game
			window.location.href = 'index.html';
		});
	</script>
</body>
</html>
